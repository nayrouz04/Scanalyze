services:
  postgres:
    image: postgres:16-alpine
    container_name: scanalyze_postgres
    environment:
      POSTGRES_DB: scanalyze
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - scanalyze_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d scanalyze"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: scanalyze_redis
    ports:
      - "6379:6379"
    volumes:
      - scanalyze_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: scanalyze_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - scanalyze_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  ollama:
    image: ollama/ollama:latest
    container_name: scanalyze_ollama
    profiles:
      - ai
    ports:
      - "11434:11434"
    volumes:
      - scanalyze_ollama_data:/root/.ollama

volumes:
  scanalyze_postgres_data:
  scanalyze_redis_data:
  scanalyze_minio_data:
  scanalyze_ollama_data:
